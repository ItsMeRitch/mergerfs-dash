name: build-and-push

# Pushing a version tag (e.g. via GitHub's "Draft new release" page)
# builds the image and publishes it to GitHub's container registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # allows triggering manually from the Actions tab

permissions:
  contents: read
  packages: write      # lets the built-in GITHUB_TOKEN push to ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU + buildx = multi-arch images (works on x86 servers AND arm/Pi).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # tag v1.2.3   -> ghcr.io/you/mergerfs-dash:1.2.3, :1.2, :latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # Links the ghcr package back to this repo (needed before you can
          # flip the package to public — see README "first release" section).
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
