# Copy this file to your server as docker-compose.yml, edit the one host
# path, then:  docker compose up -d
#
# This file stays on the server and is NOT pushed to GitHub — which is how
# the repo can be public while your drive layout stays private.
#
# You do NOT need to pass the mergerfs pool mount itself into the
# container. The app reads the underlying branches directly — they are
# just normal directories.

services:
  mergerfs-dash:
    image: ghcr.io/itsmeritch/mergerfs-dash:latest
    container_name: mergerfs-dash
    ports:
      - "8282:8282"
    volumes:
      # Map the parent dir that holds your disk mounts, read-only.
      # Every mounted filesystem found inside becomes a branch,
      # automatically — no BRANCHES variable needed.
      - /mnt:/branches:ro
      # Persistent scan cache so rescans don't happen on container restarts.
      - mergerfs-dash-data:/data
    restart: unless-stopped
    # --- optional overrides -------------------------------------------------
    # environment:
    #   BRANCHES: /branches/disk*         # glob, or comma-separated list,
    #                                     # if you only want SOME mounts
    #   PORT: "8282"
    # user: "0:0"   # if the table's "Unreadable" column shows errors
    #                 # (e.g. root-only dirs like lost+found); mounts stay
    #                 # read-only either way

volumes:
  mergerfs-dash-data:
