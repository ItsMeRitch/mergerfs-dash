# Copy this file to your server as docker-compose.yml, edit the paths,
# then:  docker compose up -d
#
# This file stays on the server and is NOT pushed to GitHub — which is how
# the repo can be public while your drive layout stays private.
#
# NOTE: you do NOT need to pass the mergerfs pool mount itself into
# the container. The app reads the underlying
# branches directly — they are just normal directories.

services:
  mergerfs-dash:
    image: ghcr.io/itsmeritch/mergerfs-dash:latest
    container_name: mergerfs-dash
    ports:
      - "8282:8282"
    environment:
      # Simplest setup: if all branches live under one host prefix
      # (e.g. /mnt/disk1, /mnt/disk2, ...), mount that prefix read-only
      # and use a glob — exactly like in a mergerfs fstab:
      BRANCHES: /branches/disk*
      # ...or list branches explicitly:
      # BRANCHES: /branches/disk1,/branches/disk2,/branches/disk3
      # PORT: "8282"
    volumes:
      # One read-only mapping of the parent dir exposes every branch:
      - /mnt:/branches:ro
      # ...or map branches individually (read-only!):
      # - /mnt/disk1:/branches/disk1:ro
      # - /mnt/disk2:/branches/disk2:ro
      # Persistent scan cache so rescans don't happen on container restarts.
      - mergerfs-dash-data:/data
    restart: unless-stopped
    # If files on your branches are not readable by UID 1000, uncomment:
    # user: "0:0"

volumes:
  mergerfs-dash-data:
